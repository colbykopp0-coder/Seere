name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[mcp]' pytest
      - run: pytest -q
      - run: python -m seere_sdk.demo work/demo
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-results-${{ matrix.python-version }}
          path: work/demo/results/demo.json
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/container_smoke.py work/container-run
      - run: python tests/agent_container_smoke.py work/container-run
